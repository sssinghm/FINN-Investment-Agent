services:
  - type: web
    name: finn-investment-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FINN_OFFLINE_MODE
        value: "0"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
